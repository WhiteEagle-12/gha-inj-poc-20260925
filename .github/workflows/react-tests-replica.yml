name: REACT Tests Dispatcher (replica)
on:
  pull_request:
    paths:
      - 'rules/**/*.toml'

permissions:
  contents: read
  id-token: write

jobs:
  dispatch:
    name: Run REACT tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch ephemeral GitHub token
        id: fetch-ephemeral-token
        run: |
          echo "token=ghs_STANDIN_FAKE_TOKEN_FOR_POC_ONLY" >> "$GITHUB_OUTPUT"

      - name: Trigger REACT workflow
        env:
          REACT_WORKFLOW_ID: "detection-rules-tests.yml"
        run: |
            curl -X POST \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ steps.fetch-ephemeral-token.outputs.token }}" \
            "https://api.github.com/repos/WhiteEagle-12/gha-inj-poc-20260925/actions/workflows/$REACT_WORKFLOW_ID/dispatches" \
            -d '{"ref": "main", "inputs": {"pr_branch": "${{ github.head_ref || github.ref_name }}", "pr_id": "${{ github.event.number }}"}}'
            exit $?
