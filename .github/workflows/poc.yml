name: PoC pypi-publish injection replica (full chain)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish (e.g. 9.5.1). The tag must already exist."
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Derive release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Verify package version matches tag
        run: |
          actual=$(sed -n 's/^__versionstr__ = "\(.*\)"/\1/p' elasticsearch/_version.py)
          expected="${{ steps.tag.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "elasticsearch/_version.py is $actual, tag is $expected"
            exit 1
          fi
          echo "VERSION_CHECK_PASSED actual=$actual expected=$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build dists
        run: python utils/build-dists.py

      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/

  publish:
    name: "Publish (inspection only)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - name: Inspect artifact (stands in for pypa/gh-action-pypi-publish)
        run: |
          echo "## Artifact contents delivered to the publish job" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist -type f | sort >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*; do echo "--- $f ---"; head -5 "$f" 2>/dev/null; done >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo
          echo "== live listing =="
          find dist -type f | sort
          if [ -f dist/POISONED_ARTIFACT.txt ]; then
            echo "POISON_CONFIRMED_IN_PUBLISH_JOB"
            echo "POISON_CONFIRMED_IN_PUBLISH_JOB" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Release egress proof (local sink, NOT PyPI)
        run: |
          python -m pip install -q twine
          mkdir -p /tmp/cap
          python - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(n)
                  open('/tmp/cap/upload.bin','wb').write(body)
                  open('/tmp/cap/headers.txt','w').write(str(self.headers))
                  self.send_response(200); self.end_headers(); self.wfile.write(b'ok')
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 8666), H).serve_forever()
          PY
          sleep 2
          echo "== twine upload pointed at local sink (same tool pypa/gh-action-pypi-publish wraps) =="
          python -m twine upload --repository-url http://127.0.0.1:8666/legacy/ -u __token__ -p dummy dist/* 2>&1 | tail -5
          sleep 1
          echo
          echo "== what would have gone to PyPI (captured locally) =="
          ls -la /tmp/cap/
          echo "POISONED_ARTIFACT.txt present in upload: $(grep -c POISONED_ARTIFACT /tmp/cap/upload.bin || true)"
          echo "wheel present in upload: $(grep -c 'elasticsearch-9.5.1-py3-none-any.whl' /tmp/cap/upload.bin || true)"
          echo "RELEASE_EGRESS_CONFIRMED"
          echo "RELEASE_EGRESS_CONFIRMED: poison file + wheel in the multipart body twine sends" >> "$GITHUB_STEP_SUMMARY"
