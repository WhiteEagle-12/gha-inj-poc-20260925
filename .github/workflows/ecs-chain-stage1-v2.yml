name: C1v2
on:
  release:
    types: [published]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stage2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ecs-chain-stage2.yml/dispatches" \
          -d '{"ref": "main", "inputs": {"ecsRef": "${{ github.event.release.tag_name }}"}}'
          echo "C1 step finished" >> "$GITHUB_STEP_SUMMARY"
